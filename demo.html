function bar(progress, { thick = false, label } = {}) {
  const el = h('div.bar', { class: thick ? 'thick' : '', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-label': label }, h('i'));
  el.set = (p) => {
    const v = clamp(p || 0, 0, 1);
    el.firstChild.style.setProperty('--p', String(v));
    el.setAttribute('aria-valuenow', String(Math.round(v * 100)));
  };
  el.set(progress);
  return el;
}

function copyButton(getText, label) {
  return h(
    'button.btn.btn-quiet.btn-sm',
    {
      type: 'button',
      onclick: async (e) => {
        const button = e.currentTarget; // gone once the event has finished, so take it before waiting
        try {
          await copyText(getText());
          toast(t('common.copied'), 'ok', { timeout: 2500 });
        } catch {
          toast(t('common.copyFailed'), 'bad');
        }
        button.focus();
      },
    },
    icon('copy'),
    label || t('common.copy'),
  );
}

// ---------------------------------------------------------------------------- the file picker

/** The segments of a path as [label, path] pairs, for the breadcrumbs. */
function pathCrumbs(path) {
  const win = /^[A-Za-z]:[\\/]/.test(path);
  const sep = win ? '\\' : '/';
  const parts = path.split(/[\\/]+/).filter(Boolean);
  const out = [];
  let acc = win ? parts.shift() + sep : sep;
  out.push([win ? acc : sep, acc]);
  for (const p of parts) {
    acc = acc.endsWith(sep) ? acc + p : acc + sep + p;
    out.push([p, acc]);
  }
  return out;
}

/**
 * Lets the person pick a file, a folder, or a model folder on this computer; resolves with the
 * path, or `null`. The server lists the folders (the page cannot see the disk by itself).
 */
async function pickPath({ mode = 'file', start = '', title }) {
  const state = { path: start, hidden: false, selected: null, data: null };
  const crumbs = h('nav.crumbs', { 'aria-label': t('pick.where') });
  const places = h('div.row');
  const list = h('ul.picker-list');
  const note = h('div');
  const chosen = h('div.hint', { 'aria-live': 'polite' });
  let closeDialog = () => {};
  let chooseButton;

  const choose = () => {
    const p = state.selected || (mode === 'folder' ? state.data?.path : null);
    if (p) closeDialog(p);
  };
  const select = (path) => {
    state.selected = path;
    chosen.textContent = path ? t('pick.selected', { path }) : '';
    for (const b of $$('.pick', list)) b.setAttribute('aria-selected', String(b.dataset.path === path));
    if (chooseButton) chooseButton.disabled = !(path || (mode === 'folder' && state.data));
  };

  async function load(path) {
    try {
      const data = await api.get('/api/fs?path=' + encodeURIComponent(path) + (state.hidden ? '&hidden=1' : ''));
      state.data = data;
      state.path = data.path;
      state.selected = null;
      render();
      mount(note);
    } catch (e) {
      mount(note, banner('bad', null, explain(e)));
    }
  }

  function render() {
    const d = state.data;
    mount(
      crumbs,
      pathCrumbs(d.path).map(([label, p], i) => [i ? h('span.sep', { 'aria-hidden': 'true' }, '›') : null, h('button', { type: 'button', onclick: () => load(p) }, label)]),
    );
    mount(
      places,
      d.roots.map((r) =>
        h('button.btn.btn-sm', { type: 'button', onclick: () => load(r.path) }, icon(r.kind === 'drive' ? 'folder' : r.kind === 'models' ? 'models' : r.kind === 'home' ? 'folder' : 'file'), r.kind === 'drive' ? r.path : t('pick.place.' + r.kind)),
      ),
    );
    const items = [];
    if (d.parent) {
      items.push(h('li', h('button.pick', { type: 'button', onclick: () => load(d.parent) }, icon('upfolder'), h('span.p-name', t('pick.up')), h('span'))));
    }
    for (const e of d.entries) {
      const full = d.path.replace(/[\\/]+$/, '') + (d.path.includes('\\') && !d.path.startsWith('/') ? '\\' : '/') + e.name;
      if (e.dir) {
        const isModel = e.model;
        const pickIt = mode === 'model' && isModel;
        items.push(
          h(
            'li',
            h(
              'button.pick',
              {
                type: 'button',
                dataset: { path: full },
                'aria-selected': 'false',
                onclick: () => (pickIt ? select(full) : load(full)),
                ondblclick: () => (pickIt ? closeDialog(full) : null),
              },
              icon(isModel ? 'models' : 'folder'),
              h('span.p-name', e.name),
              h('span.p-meta', isModel ? t('pick.model') : ''),
            ),
          ),
        );
      } else if (mode === 'file') {
        items.push(
          h(
            'li',
            h(
              'button.pick',
              { type: 'button', dataset: { path: full }, 'aria-selected': 'false', onclick: () => select(full), ondblclick: () => closeDialog(full) },
              icon('file'),
              h('span.p-name', e.name),
              h('span.p-meta', fmt.bytes(e.size)),
            ),
          ),
        );
      }
    }
    if (d.truncated) items.push(h('li', h('div.hint', { style: { padding: '0.6rem 0.8rem' } }, t('pick.truncated'))));
    if (!items.length || (items.length === 1 && d.parent)) items.push(h('li', h('div.hint', { style: { padding: '0.6rem 0.8rem' } }, t('pick.empty'))));
    mount(list, items);
    select(null);
  }

  const hiddenSwitch = switchBox({
    title: t('pick.hidden'),
    checked: false,
    onchange: (v) => {
      state.hidden = v;
      load(state.path);
    },
  });
  const modeText = mode === 'folder' ? t('pick.hintFolder') : mode === 'model' ? t('pick.hintModel') : t('pick.hintFile');

  const result = dialog({
    title: title || (mode === 'file' ? t('pick.titleFile') : mode === 'model' ? t('pick.titleModel') : t('pick.titleFolder')),
    wide: true,
    body: () => h('div.stack', h('p.hint', modeText), places, crumbs, note, list, chosen, hiddenSwitch),
    actions: [
      { label: t('common.cancel'), value: null },
    ],
    onOpen: (dlg, close) => {
      closeDialog = close;
      chooseButton = h('button.btn.btn-primary', { type: 'button', disabled: true, onclick: choose }, icon('check'), mode === 'folder' ? t('pick.chooseFolder') : t('pick.choose'));
      $('.dlg-f', dlg).appendChild(chooseButton);
      load(start || '');
    },
  });
  return result;
}

// 40-charts.js — the charts. Drawn as SVG from the numbers, nothing else: thin lines, a hairline
// grid, a legend whenever there are two series, a cursor that reads every series at once (also
// from the keyboard), a table of the same numbers, a smoothing slider and a log scale.
// Two colours carry data (--s1, --s2); everything else is ink.

function niceTicks(lo, hi, target = 5, whole = false) {
  if (!(hi > lo)) hi = lo + 1;
  const rough = (hi - lo) / target;
  const mag = 10 ** Math.floor(Math.log10(rough));
  const norm = rough / mag;
  let step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  if (whole) step = Math.max(1, Math.round(step)); // a number of steps or threads: no 10.2, 10.4…
  const ticks = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) ticks.push(Math.abs(v) < step * 1e-9 ? 0 : Number(v.toPrecision(12)));
  return { ticks, step };
}

/**
 * Gridlines for a log axis: powers of ten; with 2 and 5 when the range is short; with every digit when
 * it is shorter still. Always at least three, and never more than `most`.
 */
function logTicks(lo, hi, most = 6) {
  const make = (digits) => {
    const out = [];
    for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e += 1) {
      for (const m of digits) {
        const v = m * 10 ** e;
        if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v);
      }
    }
    return out;
  };
  for (const digits of [[1], [1, 2, 5], [1, 2, 3, 4, 5, 6, 7, 8, 9]]) {
    const out = make(digits);
    if (out.length >= 3) {
      const every = Math.ceil(out.length / most);
      return every > 1 ? out.filter((_, i) => i % every === 0) : out;
    }
  }
  return niceTicks(lo, hi, 4).ticks; // narrower than any digit step: ordinary round numbers
}

/** Exponential moving average, with the first value as the start (what the smoothing slider does). */
function smoothed(ys, amount) {
  if (!(amount > 0)) return ys;
  const alpha = 1 - amount;
  const out = [];
  let acc = null;
  for (const y of ys) {
    if (!isNum(y)) {
      out.push(y);
      continue;
    }
    acc = acc === null ? y : acc + alpha * (y - acc);
    out.push(acc);
  }
  return out;
}

/** Index of the value of `xs` (ascending) nearest to `x`. */
function nearest(xs, x) {
  let lo = 0;
  let hi = xs.length - 1;
  if (hi < 0) return -1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (xs[mid] < x) lo = mid;
    else hi = mid;
  }
  return Math.abs(xs[lo] - x) <= Math.abs(xs[hi] - x) ? lo : hi;
}

/**
 * options: label (what a screen reader hears), series [{key, name, color, dash, markers, area, smooth}],
 * xTitle, yTitle, height, canLog, canSmooth, yFormat, xFormat, valueFormat (for the tooltip).
 * `update({key: {x: [...], y: [...]}})` redraws.
 */
function lineChart(options) {
  const o = { height: 280, canLog: false, canSmooth: false, ...options };
  const state = { data: {}, log: false, smoothing: o.canSmooth ? 0.6 : 0, view: 'chart', cursor: null, width: 600 };
  const margin = { l: 54, r: 16, t: 14, b: 40 };

  const svg = s('svg', { role: 'presentation' });
  const tip = h('div.tip', { hidden: true, role: 'presentation' });
  const live = h('div.sr', { 'aria-live': 'polite' });
  const surface = h('div.chart', { tabindex: '0', role: 'group', 'aria-roledescription': t('chart.role'), 'aria-label': o.label }, svg, tip, live);
  const tableBox = tableWrap(o.yTitle || o.label);
  tableBox.hidden = true;
  const wrap = h('div.stack');

  // --- tools
  const tools = h('div.chart-tools');
  let smoothLabel = null;
  if (o.canSmooth) {
    const slider = h('input', { type: 'range', min: 0, max: 0.95, step: 0.05, value: state.smoothing, 'aria-label': t('chart.smoothing') });
    slider.addEventListener('input', () => {
      state.smoothing = Number(slider.value);
      draw();
    });
    smoothLabel = h('label', t('chart.smoothing'), slider);
    tools.appendChild(smoothLabel);
  }
  if (o.canLog) {
    const box = h('input', { type: 'checkbox' });
    box.addEventListener('change', () => {
      state.log = box.checked;
      draw();
    });
    tools.appendChild(h('label', box, t('chart.log')));
  }
  const toggle = h('button.btn.btn-quiet.btn-sm', { type: 'button', 'aria-pressed': 'false' }, icon('table'), t('chart.table'));
  toggle.addEventListener('click', () => {
    state.view = state.view === 'chart' ? 'table' : 'chart';
    toggle.setAttribute('aria-pressed', String(state.view === 'table'));
    draw();
  });
  tools.appendChild(toggle);

  const legend =
    o.series.length >= 2
      ? h(
          'div.legend',
          o.series.map((sr) => h('span', h('i', { class: sr.dash ? 'dash' : sr.markers === 'dot' ? 'dot' : '', style: { color: sr.color, borderColor: sr.color } }), sr.name)),
        )
      : null;
  wrap.append(...[tools, legend, surface, tableBox].filter(Boolean));

  const xfmt = o.xFormat || ((v) => (Math.abs(v) >= 10000 ? fmt.compact(v) : fmt.int(v)));
  // `extra` asks for more digits: the labels grow more precise until no two gridlines read the same.
  const yfmt = (v, step, extra = 0, big = false) => {
    if (o.yFormat) return o.yFormat(v, extra);
    if (big) return fmt.compact(v, extra);
    const d = clamp(-Math.floor(Math.log10(step || 1)) + extra, 0, 8);
    return nf({ minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
  };
  function yLabels(ticks, lo, hi, step) {
    const shown = ticks.filter((v) => v >= lo - 1e-9 && v <= hi + 1e-9);
    // One style for the whole axis: "9.5K, 10K, 10.5K", never "9,500, 10K".
    const big = shown.some((v) => Math.abs(v) >= 10000);
    for (let extra = 0; extra < 6; extra += 1) {
      const labels = shown.map((v) => yfmt(v, step, extra, big));
      if (new Set(labels).size === labels.length || extra === 5) return shown.map((v, i) => [v, labels[i]]);
    }
    return [];
  }
  const vfmt = o.valueFormat || ((v) => (Math.abs(v) >= 1000 ? fmt.int(v) : fmt.sig(v, 4)));

  function visible(sr) {
    const d = state.data[sr.key];
    return d && d.x && d.x.length ? d : null;
  }

  function plotted(sr) {
    const d = visible(sr);
    if (!d) return null;
    const ys = sr.smooth && state.smoothing > 0 ? smoothed(d.y, state.smoothing) : d.y;
    return { x: d.x, y: ys, raw: d.y };
  }

  let geom = null;

  function draw() {
    const W = Math.max(280, Math.round(surface.clientWidth || state.width));
    state.width = W;
    const H = o.height;
    const pw = W - margin.l - margin.r;
    const ph = H - margin.t - margin.b;
    const all = o.series.map((sr) => ({ sr, p: plotted(sr) })).filter((e) => e.p);
    toggle.hidden = all.length === 0;
    surface.hidden = state.view === 'table';
    tableBox.hidden = state.view !== 'table';
    if (smoothLabel) smoothLabel.hidden = state.view === 'table';
    if (state.view === 'table') {
      drawTable();
      return;
    }
    // domains
    let xlo = Infinity;
    let xhi = -Infinity;
    let ylo = Infinity;
    let yhi = -Infinity;
    for (const { p } of all) {
      for (let i = 0; i < p.x.length; i += 1) {
        const y = p.y[i];
        const raw = p.raw[i];
        if (!isNum(y) || (state.log && !(y > 0))) continue;
        xlo = Math.min(xlo, p.x[i]);
        xhi = Math.max(xhi, p.x[i]);
        ylo = Math.min(ylo, y, isNum(raw) && (!state.log || raw > 0) ? raw : y);
        yhi = Math.max(yhi, y, isNum(raw) && (!state.log || raw > 0) ? raw : y);
      }
    }
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('width', String(W));
    svg.setAttribute('height', String(H));
    svg.replaceChildren();
    if (!(xlo <= xhi)) {
      geom = null;
      return;
    }
    if (xhi === xlo) xhi = xlo + 1;
    if (o.yMin !== undefined) ylo = Math.min(ylo, o.yMin);
    let yTicks;
    let ylo2 = ylo;
    let yhi2 = yhi;
    if (state.log) {
      ylo2 = ylo * 0.9;
      yhi2 = yhi * 1.1;
      yTicks = logTicks(ylo2, yhi2, Math.max(3, Math.round(ph / 40)));
    } else {
      const pad = (yhi - ylo || Math.abs(yhi) || 1) * 0.08;
      ylo2 = o.yMin !== undefined ? Math.min(ylo, o.yMin) : ylo - pad;
      yhi2 = yhi + pad;
      if (ylo2 < 0 && ylo >= 0) ylo2 = 0;
      yTicks = niceTicks(ylo2, yhi2, Math.max(3, Math.round(ph / 56))).ticks;
    }
    const step = yTicks.length > 1 ? Math.min(...yTicks.slice(1).map((v, i) => Math.abs(v - yTicks[i]))) || 1 : 1;
    const X = (x) => margin.l + ((x - xlo) / (xhi - xlo)) * pw;
    const Y = state.log
      ? (y) => margin.t + ph - ((Math.log10(y) - Math.log10(ylo2)) / (Math.log10(yhi2) - Math.log10(ylo2))) * ph
      : (y) => margin.t + ph - ((y - ylo2) / (yhi2 - ylo2)) * ph;
    geom = { X, Y, xlo, xhi, margin, pw, ph, W, H, all };

    const grid = s('g', { class: 'grid' });
    const axis = s('g', { class: 'axis' });
    for (const [v, label] of yLabels(yTicks, ylo2, yhi2, step)) {
      const y = Y(v);
      grid.appendChild(s('line', { x1: margin.l, x2: W - margin.r, y1: y, y2: y }));
      axis.appendChild(s('text', { x: margin.l - 8, y: y + 4, 'text-anchor': 'end' }, label));
    }
    const xt = niceTicks(xlo, xhi, Math.max(2, Math.round(pw / 90)), o.xWhole !== false);
    for (const v of xt.ticks) {
      const x = X(v);
      axis.appendChild(s('line', { x1: x, x2: x, y1: margin.t + ph, y2: margin.t + ph + 5 }));
      axis.appendChild(s('text', { x, y: margin.t + ph + 20, 'text-anchor': 'middle' }, xfmt(v)));
    }
    axis.appendChild(s('line', { x1: margin.l, x2: W - margin.r, y1: margin.t + ph, y2: margin.t + ph }));
    if (o.xTitle) axis.appendChild(s('text', { class: 'axis-title', x: W - margin.r, y: H - 4, 'text-anchor': 'end' }, o.xTitle));
    if (o.yTitle) axis.appendChild(s('text', { class: 'axis-title', x: margin.l, y: 9 }, o.yTitle));
    svg.append(grid, axis);

    for (const { sr, p } of all) {
      const pts = [];
      for (let i = 0; i < p.x.length; i += 1) {
        if (isNum(p.y[i]) && (!state.log || p.y[i] > 0)) pts.push([X(p.x[i]), Y(p.y[i])]);
      }
      if (!pts.length) continue;
      const d = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
      if (sr.area && pts.length > 1) {
        const area = s('path', { class: 'area', d: d + `L${pts[pts.length - 1][0].toFixed(1)} ${margin.t + ph}L${pts[0][0].toFixed(1)} ${margin.t + ph}Z` });
        area.style.fill = sr.color;
        area.style.opacity = '0.1';
        svg.appendChild(area);
      }
      const smoothing = sr.smooth && state.smoothing > 0;
      if (smoothing) {
        const rawPts = [];
        for (let i = 0; i < p.x.length; i += 1) if (isNum(p.raw[i]) && (!state.log || p.raw[i] > 0)) rawPts.push([X(p.x[i]), Y(p.raw[i])]);
        const rd = rawPts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
        const raw = s('path', { class: 'ser raw', d: rd });
        raw.style.stroke = sr.color;
        svg.appendChild(raw);
      }
      if (pts.length > 1) {
        const line = s('path', { class: 'ser' + (sr.dash ? ' dash' : ''), d });
        line.style.stroke = sr.color;
        svg.appendChild(line);
      }
      // a dot on every point only while the points are far enough apart to read as dots, not as a bead chain
      const showMarkers = sr.markers === 'dot' || (sr.markers === 'auto' && pts.length <= Math.min(60, pw / 13));
      const marks = showMarkers ? pts : [pts[pts.length - 1]];
      for (const q of marks) {
        const m = s('circle', { class: 'mk', cx: q[0], cy: q[1], r: 4.5 });
        m.style.fill = sr.color;
        svg.appendChild(m);
      }
    }
    // cursor
    const cross = s('line', { class: 'cross', y1: margin.t, y2: margin.t + ph });
    cross.style.display = 'none';
    const dots = s('g');
    svg.append(cross, dots);
    const hit = s('rect', { class: 'hit', x: margin.l, y: margin.t, width: pw, height: ph });
    svg.appendChild(hit);
    geom.cross = cross;
    geom.dots = dots;
    if (state.cursor !== null) showCursorAtX(state.cursor, false);
    else tip.hidden = true;
  }

  function seriesAt(x) {
    const rows = [];
    for (const { sr, p } of geom.all) {
      const i = nearest(p.x, x);
      if (i < 0) continue;
      rows.push({ sr, x: p.x[i], y: p.raw[i], shown: p.y[i] });
    }
    return rows;
  }

  function showCursorAtX(x, speak) {
    if (!geom) return;
    const rows = seriesAt(x).filter((r) => isNum(r.y));
    if (!rows.length) return;
    // the main series decides where the cursor stands
    const lead = rows.reduce((a, b) => (Math.abs(a.x - x) <= Math.abs(b.x - x) ? a : b));
    state.cursor = lead.x;
    const cx = geom.X(lead.x);
    geom.cross.style.display = '';
    geom.cross.setAttribute('x1', String(cx));
    geom.cross.setAttribute('x2', String(cx));
    geom.dots.replaceChildren();
    for (const r of rows) {
      const c = s('circle', { class: 'mk', cx: geom.X(r.x), cy: geom.Y(r.y), r: 5.5 });
      c.style.fill = r.sr.color;
      geom.dots.appendChild(c);
    }
    const xt = o.xTitle ? o.xTitle + ' ' : '';
    // A series with no point at this x shows its nearest one, and says where that is.
    const where = (r) => (r.x !== lead.x ? ` (${xt}${fmt.int(r.x)})` : '');
    mount(
      tip,
      h('div.tip-h', `${xt}${fmt.int(lead.x)}`),
      rows.map((r) => h('div.tip-r', h('span', h('i.sw', { style: { background: r.sr.color } }), r.sr.name), h('b', vfmt(r.y) + where(r)))),
    );
    tip.hidden = false;
    const tw = tip.offsetWidth || 150;
    const left = cx + 14 + tw > geom.W ? cx - tw - 14 : cx + 14;
    tip.style.left = `${Math.max(0, left)}px`;
    tip.style.top = `${margin.t + 4}px`;
    if (speak) live.textContent = `${xt}${fmt.int(lead.x)}: ` + rows.map((r) => `${r.sr.name} ${vfmt(r.y)}${where(r)}`).join(', ');
  }

  function hideCursor() {
    state.cursor = null;
    tip.hidden = true;
    if (geom?.cross) geom.cross.style.display = 'none';
    geom?.dots?.replaceChildren();
  }

  svg.addEventListener('pointermove', (e) => {
    if (!geom) return;
    const box = svg.getBoundingClientRect();
    const x = geom.xlo + ((e.clientX - box.left - margin.l) / geom.pw) * (geom.xhi - geom.xlo);
    showCursorAtX(clamp(x, geom.xlo, geom.xhi), false);
  });
  svg.addEventListener('pointerleave', () => {
    if (document.activeElement !== surface) hideCursor();
  });
  surface.addEventListener('blur', hideCursor);
  surface.addEventListener('keydown', (e) => {
    if (!geom) return;
    const primary = geom.all.reduce((a, b) => (a.p.x.length >= b.p.x.length ? a : b)).p;
    let i = state.cursor === null ? primary.x.length - 1 : nearest(primary.x, state.cursor);
    const jump = Math.max(1, Math.round(primary.x.length / 10));
    if (e.key === 'ArrowLeft') i -= e.shiftKey ? jump : 1;
    else if (e.key === 'ArrowRight') i += e.shiftKey ? jump : 1;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = primary.x.length - 1;
    else if (e.key === 'Escape') return hideCursor();
    else return;
    e.preventDefault();
    showCursorAtX(primary.x[clamp(i, 0, primary.x.length - 1)], true);
  });

  function drawTable() {
    const xs = new Set();
    for (const sr of o.series) for (const x of visible(sr)?.x || []) xs.add(x);
    let rows = [...xs].sort((a, b) => a - b);
    if (rows.length > 200) {
      const keep = [];
      for (let i = 0; i < 200; i += 1) keep.push(rows[Math.round((i * (rows.length - 1)) / 199)]);
      rows = [...new Set(keep)];
    }
    const lookup = o.series.map((sr) => {
      const d = visible(sr);
      const m = new Map();
      if (d) d.x.forEach((x, i) => m.set(x, d.y[i]));
      return m;
    });
    mount(
      tableBox,
      h(
        'table.tbl',
        h('caption', o.label),
        h('thead', h('tr', h('th', o.xTitle || 'x'), o.series.map((sr) => h('th.r', sr.name)))),
        h(
          'tbody',
          rows.map((x) => h('tr', h('td', fmt.int(x)), lookup.map((m) => h('td.r', m.has(x) ? vfmt(m.get(x)) : '–')))),
        ),
      ),
    );
  }

  const redraw = frameBatched(draw);
  if (typeof ResizeObserver !== 'undefined') {
    let lastWidth = 0;
    new ResizeObserver(() => {
      const w = surface.clientWidth;
      if (w && Math.abs(w - lastWidth) > 1) {
        lastWidth = w;
        redraw();
      }
    }).observe(surface);
  }

  return {
    el: wrap,
    update(data) {
      state.data = data;
      redraw();
    },
    redrawNow: draw,
  };
}

function figure(number, caption, content) {
  return h('figure.fig', content, h('figcaption.figcap', h('b', t('chart.fig', { n: number })), ' ', caption));
}

function applyPrefs() {
  const st = S.settings;
  const root = document.documentElement;
  setLang(st.lang || 'auto');
  const dark = st.theme === 'dark' || (st.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme = dark ? 'dark' : 'light';
  root.dataset.contrast = st.contrast === 'more' ? 'more' : 'auto';
  root.dataset.motion = st.motion === 'reduce' ? 'reduce' : 'auto';
  root.dataset.density = st.density === 'compact' ? 'compact' : 'comfortable';
  root.style.setProperty('--scale', String(clamp(Number(st.text_scale) || 1, 0.85, 1.6)));
  const shell = $('.shell');
  if (shell) shell.dataset.rail = st.rail === 'icons' ? 'compact' : 'full';
  bus.emit('prefs');
}

let saveQueue = Promise.resolve();
/** Saves some settings (the server checks them) and applies what it answers. */
function saveSettings(patch) {
  Object.assign(S.settings, patch);
  const send = async () => {
    try {
      S.settings = await api.put('/api/settings', patch);
      applyPrefs();
    } catch (e) {
      toast(explain(e), 'bad');
      try {
        S.settings = await api.get('/api/settings');
        applyPrefs();
      } catch {
        /* the next try will show it */
      }
    }
  };
  saveQueue = saveQueue.then(send);
  return saveQueue;
}
const saveFormLater = debounce((form) => saveSettings({ form }), 700);

function route() {
  const found = /^#\/([a-z]+)(?:\/(.*))?$/.exec(location.hash);
  const id = found && PAGES[found[1]] ? found[1] : 'train';
  const arg = found?.[2] ? decodeURIComponent(found[2]) : '';
  currentPage?.destroy?.();
  primaryAction = null;
  const main = $('#main');
  const page = PAGES[id]({ arg });
  mount(main, banners(), page.el);
  currentPage = { id, destroy: page.destroy };
  for (const a of $$('.rail-item[data-page]')) {
    if (a.dataset.page === id) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
  pageTitle = `${t('nav.' + id)} · GERMEN Studio`;
  updateTitle();
  window.scrollTo(0, 0);
  drawOnlineBanner();
  if (S.refocus) {
    $(S.refocus)?.focus();
    S.refocus = null;
  } else if (S.routed) {
    $('#page-title')?.focus({ preventScroll: true });

function modelFacts(m) {
  const fact = (label, value) => h('span', label + ' ', h('b', value));
  if (m.error) return [h('span', h('b', t('models.unreadable')))];
  const out = [fact(t('models.fact.step'), fmt.int(m.step)), fact(t('models.fact.params'), fmt.compact(m.params))];
  out.push(fact(t('models.fact.vocab'), m.tokenizer === 'bpe' ? t('models.vocabBpe', { n: fmt.int(m.vocab_size) }) : t('models.vocabByte')));
  if (isNum(m.best_val_loss)) out.push(fact(t('models.fact.val'), fmt.loss(m.best_val_loss)));
  else if (isNum(m.last_train_loss)) out.push(fact(t('models.fact.loss'), fmt.loss(m.last_train_loss)));
  out.push(fact(t('models.fact.size'), fmt.bytes(m.bytes)));
  return out;
}

// ---------------------------------------------------------------------------- writing

function PageGenerate({ arg }) {
  const saved = S.settings.form || {};
  const f = {
    model: arg || S.genModel || '',
    prompt: S.genPrompt || '',
    max_new: Number(saved.gen_max_new) || 300,
    temperature: isNum(saved.gen_temperature) ? saved.gen_temperature : 0.8,
    top_k: isNum(saved.gen_top_k) ? saved.gen_top_k : 40,
    window: Number(saved.gen_window) || 128,
    seed: '',
  };
  const gen = { state: 'idle', job: null, ctl: null, info: null, result: null, error: null };
  const root = h('div.page');
  const outPrompt = h('span.prompt');
  const outText = document.createTextNode('');
  const cursor = h('span.cursor', { hidden: true });
  const outBox = h('div.out-box', { 'aria-live': 'off' }, outPrompt, outText, cursor);
  const status = h('div.row.sans', { 'aria-live': 'off' });
  const actions = h('div.row');
  const unsub = bus.on('models', buildForm);
  const saveGen = () => {
    const next = { ...(S.settings.form || {}), gen_max_new: f.max_new, gen_temperature: f.temperature, gen_top_k: f.top_k, gen_window: f.window };
    S.settings.form = next;
    saveFormLater(next);
  };

  function modelInfo() {
    return S.models.find((m) => m.name === f.model);
  }

  function setState(state) {
    gen.state = state;
    cursor.hidden = !(state === 'writing' || state === 'loading');
    drawStatus();
  }

  function drawStatus() {
    const busy = gen.state === 'loading' || gen.state === 'writing' || gen.state === 'stopping';
    mount(
      status,
      gen.state === 'loading' ? chip('run', t('gen.loading'), 'clock') : null,
      gen.state === 'writing' ? chip('run', t('gen.writing'), 'write') : null,
      gen.state === 'stopping' ? chip('warn', t('gen.stopping'), 'clock') : null,
      gen.state === 'done' && gen.result ? [chip('ok', t('gen.done'), 'check'), h('span.muted', t('gen.stats', { tokens: fmt.int(gen.result.tokens), rate: fmt.int(gen.result.tokens_per_sec), seed: gen.result.seed }))] : null,
      gen.state === 'stopped' && gen.result ? [chip('warn', t('gen.stopped'), 'stop'), h('span.muted', t('gen.stats', { tokens: fmt.int(gen.result.tokens), rate: fmt.int(gen.result.tokens_per_sec), seed: gen.result.seed }))] : null,
      gen.state === 'failed' ? chip('bad', gen.error || t('err.unknown'), 'error') : null,
      gen.info ? h('span.muted', t('gen.loaded', { step: fmt.int(gen.info.step), params: fmt.compact(gen.info.params) })) : null,
    );
    const hasText = outText.data.length > 0;
    mount(
      actions,
      busy
        ? h('button.btn.btn-lg', { type: 'button', onclick: stop }, icon('stop'), t('gen.stop'))
        : h('button.btn.btn-primary.btn-lg', { type: 'button', disabled: !f.model, onclick: start }, icon('write'), t('gen.start')),
      hasText && !busy ? copyButton(() => outPrompt.textContent + outText.data, t('gen.copy')) : null,
      hasText && !busy
        ? h('button.btn.btn-quiet.btn-sm', { type: 'button', onclick: () => { f.prompt = outPrompt.textContent + outText.data; S.genPrompt = f.prompt; outPrompt.textContent = ''; outText.data = ''; buildForm(); } }, icon('plus'), t('gen.continueFrom'))
        : null,
    );
  }

  async function start() {
    if (!f.model) return;
    const body = { model: f.model, prompt: f.prompt, max_new: f.max_new, temperature: f.temperature, top_k: f.top_k, window: f.window };
    if (f.seed !== '' && f.seed !== null) body.seed = Number(f.seed);
    gen.info = null;
    gen.result = null;
    gen.error = null;
    outPrompt.textContent = f.prompt;
    outText.data = '';
    setState('loading');
    if (matchMedia('(max-width: 70rem)').matches) reveal(result, 'start');
    try {
      const r = await api.post('/api/generate', body);
      gen.job = r.job;
      gen.ctl = new AbortController();
      follow(r.job, {
        signal: gen.ctl.signal,
        onSnapshot: (snap) => {
          outText.data = printable(snap.generate?.text);
        },
        onEvent: (e) => {
          if (e.type === 'loaded') {
            gen.info = e;
            setState('writing');
          } else if (e.type === 'text') {
            outText.data += printable(e.text);
          } else if (e.type === 'end') {
            gen.result = e.result;
            if (e.state === 'failed') {
              gen.error = e.error?.message || t('err.unknown');
              if (e.error?.code) gen.error = explain(new ApiFailure(422, e.error.code, e.error.message, e.error.params));
              announce(gen.error, true);
            } else {
              announce(t('gen.finished', { tokens: fmt.int(e.result?.tokens || 0) }));
            }
            gen.job = null;
            setState(e.state);
          }
        },
      }).catch((e) => {
        setState('failed');
        gen.error = explain(e);
        drawStatus();
      });
    } catch (e) {
      gen.error = explain(e);
      setState('failed');
      toast(gen.error, 'bad');
    }
  }

  async function stop() {
    if (!gen.job) return;
    setState('stopping');
    try {
      await api.post(`/api/jobs/${gen.job}/stop`);
    } catch (e) {
      toast(explain(e), 'bad');
    }
  }

  function buildForm() {
    const models = S.models;
    const sel = h('select.select');
    const options = models.filter((m) => !m.error).map((m) => h('option', { value: m.name, selected: m.name === f.model }, `${m.name} (${fmt.compact(m.params)})`));
    if (f.model && !models.some((m) => m.name === f.model)) options.unshift(h('option', { value: f.model, selected: true }, basename(f.model)));
    sel.append(...options, h('option', { value: '__other' }, t('gen.otherFolder')));
    if (!f.model && models.length) f.model = models.find((m) => !m.error)?.name || '';
    if (f.model) sel.value = f.model;
    sel.addEventListener('change', async () => {
      if (sel.value === '__other') {
        const path = await pickPath({ mode: 'model' });
        if (path) {
          f.model = path;
          S.genModel = path;
        }
        buildForm();
        return;
      }
      f.model = sel.value;
      S.genModel = f.model;
      buildForm();
    });
    const info = modelInfo();
    const training = S.run?.active && S.run.label === f.model;
    const prompt = h('textarea.textarea', { rows: 4, placeholder: t('gen.promptPlaceholder'), maxlength: 20000 });
    prompt.value = f.prompt;
    prompt.addEventListener('input', () => {
      f.prompt = prompt.value;
      S.genPrompt = f.prompt;
    });
    const lengthInput = numberInput({ value: f.max_new, min: 1, max: 20000, onchange: (v) => { if (v) { f.max_new = clamp(Math.round(v), 1, 20000); saveGen(); } } });
    const temp = h('input', { type: 'range', min: 0, max: 2, step: 0.05, value: f.temperature });
    const tempNum = numberInput({ label: t('gen.temperature'), value: f.temperature, min: 0, max: 5, step: 0.05, inputmode: 'decimal', onchange: (v) => { if (v !== null) { f.temperature = clamp(v, 0, 5); temp.value = String(f.temperature); saveGen(); } } });
    temp.addEventListener('input', () => {
      f.temperature = Number(temp.value);
      tempNum.value = String(f.temperature);
      saveGen();
    });

const bench = { run: null, ctl: null, listeners: new Set() };

function benchChanged() {
  bus.emit('bench');
}

function benchApply(e) {
  const r = bench.run;
  if (!r) return;
  if (e.type === 'bench_plan') r.plan = e;
  else if (e.type === 'bench_running') r.current = e.preset;
  else if (e.type === 'bench_result') {
    r.results.push(e.result);
    r.current = null;
  } else if (e.type === 'scaling_point') {
    r.points.push(e);
    r.current = null;
  } else if (e.type === 'end') {
    r.state = e.state;
    r.result = e.result;
    r.error = e.error;
    r.current = null;
    if (e.state === 'done') rememberBench(r);
  }
  benchChanged();
}

function rememberBench(r) {
  const saved = { ...(S.settings.bench || {}) };
  for (const res of r.results) {
    saved[res.preset] = { tps: res.tokens_per_sec, ms: res.ms_per_step, threads: S.system?.workers || 0, batch: res.batch, seq: res.seq, at: Math.round(Date.now() / 1000) };
  }
  for (const p of r.points) {
    const res = p.point.result;
    const best = saved[p.preset];
    if (!best || res.tokens_per_sec > best.tps) saved[p.preset] = { tps: res.tokens_per_sec, ms: res.ms_per_step, threads: p.point.threads, batch: res.batch, seq: res.seq, at: Math.round(Date.now() / 1000) };
  }
  saveSettings({ bench: saved });
}

function benchAttach(id, snap) {
  bench.ctl?.abort();
  bench.ctl = new AbortController();
  const b = snap?.bench || {};
  bench.run = {
    id,
    state: snap?.state || 'running',
    plan: b.plan?.type ? b.plan : null,
    results: (b.results || []).slice(),
    points: (b.points || []).slice(),
    current: b.current?.preset || null,
    result: snap?.result || null,
    error: snap?.error || null,
  };
  benchChanged();
  if (FINAL.has(bench.run.state)) return;
  follow(id, {
    after: snap?.seq || 0,
    signal: bench.ctl.signal,
    onEvent: benchApply,
    onSnapshot: (s2) => benchAttach(id, s2),
  }).catch(() => {});
}

async function benchStart(body) {
  const r = await api.post('/api/bench', body);
  benchAttach(r.job, null);
}

    const parts = text.split(/[\s,;]+/).filter(Boolean).map(Number);

    return parts;

  async function start() {
    error = null;

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [523.25, 783.99].forEach((hz, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = hz;
      gain.gain.setValueAtTime(0.0001, now + i * 0.18);
      gain.gain.exponentialRampToValueAtTime(0.18, now + i * 0.18 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.18 + 0.7);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.18);
      osc.stop(now + i * 0.18 + 0.75);
    });
    setTimeout(() => ctx.close(), 1500);
  } catch {
    /* no audio: nothing to do */
  }
}

    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && primaryAction && !document.querySelector('dialog[open]')) {

      primaryAction();

    if (typing || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;

const run = {
  id: null,
  state: 'idle', // idle | starting | running | stopping | done | stopped | failed
  label: '',
  request: null,
  stage: { name: 'queued' },
  start: null,
  last: null,
  lastEval: null,
  steps: new Curve(RUN_COLS),
  evals: new Curve(EVAL_COLS),
  samples: [],
  log: [],
  result: null,
  error: null,
  started: 0,
  ctl: null,
  tail: [],
  recent: null,
  firstLoss: null,
  milestone: 0,
  get active() {
    return this.state === 'starting' || this.state === 'running' || this.state === 'stopping';
  },
  get progress() {
    if (this.state === 'done') return 1;
    const l = this.last;
    return l && isNum(l.total) && l.total > 0 ? clamp(l.step / l.total, 0, 1) : 0;
  },
};
S.run = run;

// The big number is the mean of the last few logged losses: it follows the curve closely, but one noisy
// batch does not make it jump. (A longer average would trail far behind a loss that is still falling fast.)
const LOSS_TAIL = 3;
function noteLoss(x) {
  run.tail.push(x);
  if (run.tail.length > LOSS_TAIL) run.tail.shift();
  run.recent = run.tail.reduce((a, b) => a + b, 0) / run.tail.length;
}

const emitRun = frameBatched(() => bus.emit('run'));
const runClock = () => Math.max(0, Date.now() / 1000 - (run.started || Date.now() / 1000));

function runReset() {
  run.ctl?.abort();
  Object.assign(run, {
    id: null,
    state: 'idle',
    label: '',
    request: null,
    stage: { name: 'queued' },
    start: null,
    last: null,
    lastEval: null,
    steps: new Curve(RUN_COLS),
    evals: new Curve(EVAL_COLS),
    samples: [],
    log: [],
    result: null,
    error: null,
    started: 0,
    ctl: null,
    tail: [],
    recent: null,
    firstLoss: null,
    milestone: 0,
  });
  bus.emit('run');
}

function runFromSnapshot(snap) {
  const tr = snap.train || {};
  run.id = snap.id;
  run.label = snap.label;
  run.request = snap.request;
  run.state = snap.state;
  run.started = snap.started;
  run.stage = tr.stage || { name: 'queued' };
  run.start = tr.start?.type ? tr.start : null;
  run.last = tr.last?.type ? tr.last : null;
  run.steps = Curve.from(RUN_COLS, tr.steps);
  run.evals = Curve.from(EVAL_COLS, tr.evals);
  run.samples = (tr.samples || []).map((x) => ({ ...x, text: printable(x.text) }));
  run.log = (tr.log || []).slice();
  run.result = snap.result && typeof snap.result === 'object' && Object.keys(snap.result).length ? snap.result : null;
  run.error = snap.error?.code ? snap.error : null;
  const losses = run.steps.col('loss').filter(isNum);
  run.firstLoss = losses.length ? losses[0] : null;
  run.tail = [];
  run.recent = null;
  for (const x of losses.slice(-LOSS_TAIL)) noteLoss(x);
  const evals = run.evals;
  run.lastEval = evals.length ? { step: last(evals.col('step')), val_loss: last(evals.col('val_loss')), bpb: last(evals.col('bpb')) } : null;
  run.milestone = Math.floor((run.progress * 100) / 25) * 25;
  if (run.milestone >= 100) run.milestone = 75;
}

function runApply(e) {
  switch (e.type) {
    case 'stage':
      run.stage = { name: e.name, done: e.done, total: e.total };
      if (e.total === null || e.total === undefined) run.log.push({ t: runClock(), type: 'stage', name: e.name });
      break;
    case 'start':
      run.start = e;
      run.stage = { name: 'training' };
      if (run.state === 'starting') run.state = 'running';
      run.log.push({ t: runClock(), type: 'start' });
      break;
    case 'step':
      run.last = e;
      run.steps.push([e.step, e.loss, e.lr, e.tps, e.grad_norm]);
      if (run.state === 'starting') run.state = 'running';
      if (isNum(e.loss)) {
        noteLoss(e.loss);
        if (run.firstLoss === null) run.firstLoss = e.loss;
      }
      announceMilestone();
      break;
    case 'eval':
      run.evals.push([e.step, e.val_loss, e.bpb, e.best ? 1 : 0]);
      run.lastEval = e;
      break;
    case 'sample':
      run.samples.push({ step: e.step, text: printable(e.text) });
      if (run.samples.length > 16) run.samples.shift();
      break;
    case 'saved':
      run.log.push({ t: runClock(), type: 'saved', step: e.step });
      break;
    case 'recovered':
      run.log.push({ t: runClock(), type: 'recovered', kind: e.kind, files: e.files });
      break;
    case 'stopping':
      run.state = 'stopping';
      run.log.push({ t: runClock(), type: 'stopping' });
      break;
    case 'end':
      runEnded(e);
      break;
    default:
      break;
  }
  if (run.log.length > 300) run.log.splice(0, run.log.length - 300);
  emitRun();
}

function announceMilestone() {
  const pct = run.progress * 100;
  if (pct >= run.milestone + 25 && pct < 100) {
    run.milestone = Math.floor(pct / 25) * 25;
    announce(t('run.milestone', { pct: run.milestone, loss: fmt.loss(run.recent) }));
  }
}

function runEnded(e) {
  run.state = e.state;
  run.result = e.result && typeof e.result === 'object' && Object.keys(e.result).length ? e.result : null;
  run.error = e.error?.code ? e.error : null;
  run.log.push({ t: runClock(), type: 'end', state: e.state });
  refreshModels();
  notifyEnd();
}

function notifyEnd() {
  const name = run.label;
  const loss = fmt.loss(run.result?.best_val_loss ?? run.result?.last_train_loss);
  const text = run.state === 'done' ? t('notify.done', { name, loss }) : run.state === 'stopped' ? t('notify.stopped', { name }) : t('notify.failed', { name });
  announce(text, run.state === 'failed');
  if (S.settings.sound && run.state === 'done') playChime();
  if (S.settings.notify && typeof Notification !== 'undefined' && Notification.permission === 'granted' && (document.hidden || !document.hasFocus())) {
    try {
      new Notification('GERMEN', { body: text, tag: 'germen-run' });
    } catch {
      /* some browsers only allow notifications from a service worker: nothing to do */
    }
  }
}

/** Starts following the training job `id` (its snapshot is fetched unless one is given). */
async function runAttach(id, snap) {
  run.ctl?.abort();
  const snapshot = snap || (await api.get(`/api/jobs/${id}`));
  runFromSnapshot(snapshot);
  run.ctl = new AbortController();
  bus.emit('run');
  if (FINAL.has(run.state)) return;
  follow(id, {
    after: snapshot.seq,
    signal: run.ctl.signal,
    onEvent: runApply,
    onSnapshot: (again) => {
      runFromSnapshot(again);
      bus.emit('run');
    },
  }).catch((e) => {
    if (e instanceof ApiFailure && e.status === 404 && run.id === id && run.active) {
      run.state = 'failed';
      run.error = { code: 'lost', message: e.message };
      bus.emit('run');
    }
  });
}

async function runStop() {
  if (!run.id || !run.active) return;
  try {
    await api.post(`/api/jobs/${run.id}/stop`);
  } catch (e) {
    toast(explain(e), 'bad');
  }
}

let pageTitle = 'GERMEN Studio';
function updateTitle() {
  document.title = (run.active ? `${fmt.pct(run.progress)} · ` : '') + pageTitle;
}

  preset: 't_preset',
  tokenizer: 't_tok',
