name: Dependency audit

# Checks Cargo.lock against the RustSec advisory database. It runs weekly and whenever the
# dependencies change, apart from the main CI so that a new advisory never blocks an unrelated push.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml", ".github/workflows/audit.yml"]

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec advisories
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit
