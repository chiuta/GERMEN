name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A newer push supersedes an older run of the same branch; a tag build (a release) is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest stable Rust with rustfmt and clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  msrv:
    name: minimum supported Rust (1.95)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the Rust version that Cargo.toml promises (rust-version)
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest stable Rust (Burn 0.22 needs 1.95 or newer)
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests (release, so they finish quickly)
        run: cargo test --release --workspace
      - name: Build the command-line tool
        run: cargo build --release -p germen-cli
      - name: Smoke test, end to end (bench, train, resume, BPE, generate)
        shell: bash
        run: |
          BIN=target/release/germen
          "$BIN" info
          "$BIN" bench --preset nano --batch 4 --seq 64 --steps 2 --warmup 1
          "$BIN" bench --scaling 1,2 --preset nano --batch 4 --seq 64 --steps 1 --warmup 0
          "$BIN" train --demo --demo-mb 0.2 --preset nano --seq 64 --batch 8 \
                 --steps 40 --eval-every 20 --eval-batches 2 --log-every 10 \
                 --out ci-model
          "$BIN" train --demo --demo-mb 0.2 --seq 64 --batch 4 --accum 2 \
                 --steps 60 --eval-every 20 --eval-batches 2 --log-every 10 \
                 --out ci-model --resume
          # Resuming a run that is already complete is a quiet success (a "resume until done" loop ends)
          "$BIN" train --demo --demo-mb 0.2 --seq 64 --batch 4 --accum 2 \
                 --steps 60 --eval-every 20 --eval-batches 2 --log-every 10 \
                 --out ci-model --resume
          "$BIN" generate --model ci-model --max-new 40 --seed 1
          # Data-parallel replicas: forced above the number of threads, and switched off
          "$BIN" train --demo --demo-mb 0.2 --preset nano --seq 64 --batch 8 --replicas 3 \
                 --steps 20 --eval-every 10 --eval-batches 2 --log-every 10 --out ci-replicas
          "$BIN" train --demo --demo-mb 0.2 --preset nano --seq 64 --batch 8 --replicas 1 \
                 --steps 20 --eval-every 10 --eval-batches 2 --log-every 10 --out ci-single
          "$BIN" bench --preset nano --batch 8 --seq 64 --steps 2 --warmup 1 --replicas 1
          "$BIN" train --demo --demo-mb 0.2 --preset nano --tokenizer bpe --vocab 400 \
                 --seq 64 --batch 8 --steps 30 --eval-every 15 --eval-batches 2 \
                 --log-every 10 --out ci-bpe
          "$BIN" generate --model ci-bpe --max-new 40 --seed 1

  release:
    name: draft pre-release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Create the draft pre-release (binaries are attached by the next job)
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
             --title "GERMEN $GITHUB_REF_NAME" --generate-notes

  dist:
    name: binary (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            name: germen-linux-x86_64
            exe: germen
          - os: windows-latest
            name: germen-windows-x86_64
            exe: germen.exe
          - os: macos-latest
            name: germen-macos-arm64
            exe: germen
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Build with fat LTO
        run: cargo build --profile dist -p germen-cli
      - name: Pack
        shell: bash
        run: |
          mkdir -p "${{ matrix.name }}"
          cp "target/dist/${{ matrix.exe }}" README*.md LICENSE CHANGELOG.md "${{ matrix.name }}/"
          PY=$(command -v python3 || command -v python)
          "$PY" -m zipfile -c "${{ matrix.name }}.zip" "${{ matrix.name }}"
      - name: Attach to the release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.name }}.zip" --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip
