name: tag a release

# Run by hand (Actions -> "tag a release" -> Run workflow): creates the tag v<version> on a commit of
# `main` and starts the CI run for it, whose last jobs make the draft pre-release and attach the
# binaries. A tag pushed with the workflow's own token does not start other workflows, so CI is
# started explicitly (workflow_dispatch is the one exception GitHub allows).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, as in Cargo.toml (for example 0.5.0)"
        required: true
      commit:
        description: "Commit to tag (empty = the tip of main)"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Tag it
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a version: $VERSION"; exit 1; }
          TAG="v$VERSION"
          SHA=$(git rev-parse --verify "${COMMIT:-HEAD}^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"; exit 1
          fi
          CARGO=$(git show "$SHA:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "Cargo.toml at $SHA says $CARGO"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "GERMEN $TAG"
          git push origin "refs/tags/$TAG"
          # CI at the tagged commit can only be started if that commit's ci.yml allows it.
          if git show "$SHA:.github/workflows/ci.yml" | grep -q '^  workflow_dispatch:'; then
            gh workflow run ci.yml --ref "$TAG"
            echo "CI started for $TAG"
          else
            echo "Tagged $TAG; that commit's CI cannot be started by hand, so there is no release build for it."
          fi
